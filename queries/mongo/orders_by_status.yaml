description: Pedidos por estado en los últimos N días
engine: mongo
operation: find
target:
  database: sales
  collection: orders
params:
  status:
    type: str
    required: true
    choices: [PENDING, PAID, SHIPPED, CANCELLED]
  days:
    type: int
    default: 7
    description: Ventana hacia atrás
  limit:
    type: int
    default: 100
template: |
  filter:
    status: {{ status }}
    createdAt:
      $gte: {"$date": {"$subtract": ["$$NOW", {{ days * 86400000 }}]}}
  projection: {orderId: 1, customerId: 1, total: 1, status: 1, createdAt: 1}
  sort: {createdAt: -1}
  limit: {{ limit }}
